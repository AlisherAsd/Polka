# Cloudflare D1 (локальный режим для разработки).
# `database_id` — заглушка: для remote/production её нужно заменить
# на реальный id из `npx wrangler d1 create polka-db`.
name = "polka-backend"
main = "src/server.ts"
compatibility_date = "2025-07-15"

[[d1_databases]]
binding = "DB"
database_name = "polka-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
